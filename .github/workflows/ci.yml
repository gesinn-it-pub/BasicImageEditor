name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-26.04
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - mediawiki_version: '1.43'
            php_version: '8.3'
            database_type: mysql
            database_image: "mariadb:11.2"
            phan: true
            experimental: false
          - mediawiki_version: '1.46'
            php_version: '8.5'
            database_type: mysql
            database_image: "mariadb:11.2"
            phan: false
            experimental: true

    env:
      MW_VERSION: ${{ matrix.mediawiki_version }}
      PHP_VERSION: ${{ matrix.php_version }}
      DB_TYPE: ${{ matrix.database_type }}
      DB_IMAGE: ${{ matrix.database_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Run tests
        run: make ci

      - name: Run Phan
        run: make composer-phan
        if: matrix.phan == true
